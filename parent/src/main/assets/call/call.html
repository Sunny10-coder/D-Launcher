<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Family call</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 20%, #4a3a5c 0%, #241c2c 55%, #17121b 100%);
      overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; }
    #local {
      position: absolute; right: 16px; top: 16px; width: 28vw; max-width: 160px;
      aspect-ratio: 3 / 4; border-radius: 18px; object-fit: cover;
      border: 2px solid rgba(255,255,255,.35); box-shadow: 0 10px 30px rgba(0,0,0,.35);
      background: #1b1520; display: none;
    }
    #local.on { display: block; }
    #veil {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #orb {
      width: 132px; height: 132px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffd9a8, #ff9f7a 45%, #d96b8a 100%);
      opacity: .18; transition: transform .6s ease, opacity .4s ease;
      box-shadow: 0 0 90px rgba(255,159,122,.45);
    }
    #orb.talking { opacity: .34; transform: scale(1.12); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div id="veil"><div id="orb"></div></div>
  <script src="call.js"></script>
</body>
</html>
